name: Atualizar Tarifas ANEEL (CKAN)

# Extração direta do Dados Abertos da ANEEL (CKAN). Sem proxy, sem Playwright,
# sem download manual de xlsx. Roda toda segunda 09:00 UTC e commita se mudou.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  extrair:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install requests pandas

      - name: Extrair tarifas (CKAN direto)
        run: python atualizar_ckan.py --output data/tarifas_aneel.json

      - name: Verificar resultado
        run: |
          python3 -c "import json,sys; from pathlib import Path; d=json.loads(Path('data/tarifas_aneel.json').read_text()); dist=d.get('distribuidoras',{}); print(f'{len(dist)} distribuidoras'); sys.exit(0 if (len(dist)>=40 and 'Enel SP' in dist) else 1)"

      - name: Commitar se houve mudanca
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tarifas_aneel.json
          git diff --staged --quiet && echo "Sem mudancas." || (git commit -m "chore: atualiza tarifas ANEEL $(date -u +%Y-%m-%d)" && git push)
